name: catalog
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  equatable: ^2.0.5
  flutter_bloc: ^9.1.1
  go_router: ^17.0.0
  liquid_glass_renderer: ^0.2.0-dev.4
  shared_preferences: ^2.5.3
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  drift_dev: ^2.29.0
  build_runner: ^2.9.0

flutter:

  uses-material-design: true

  assets:
    - assets/png/
    - assets/svg/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Rubik-Medium.ttf
